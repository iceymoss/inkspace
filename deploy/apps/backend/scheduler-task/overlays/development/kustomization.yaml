apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkspace-backend

resources:
  - ../../base

# Same BLOG origin as blog-api, despite having no public HTTP listener.
configMapGenerator:
  - name: scheduler-task-public-site
    literals:
      - PUBLIC_SITE_URL=http://dev.blog.test.com

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: scheduler-task

images:
  - name: inkspace-scheduler-task-image # 对应 Base 中的占位符
    newName: iceymoss/go-web    # 替换为真实的镜像
    newTag: "1.0"            # 替换 Tag
