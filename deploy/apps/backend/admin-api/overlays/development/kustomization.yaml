apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkspace-backend

resources:
  - ../../base

# Same BLOG origin as blog-api, not the admin ingress.
configMapGenerator:
  - name: admin-api-public-site
    literals:
      - PUBLIC_SITE_URL=http://dev.blog.test.com

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: admin-api
  - path: ingress-traefik-patch.yaml
    target:
      kind: Ingress
      name: admin-api-ingress

images:
  - name: inkspace-admin-api-image # 对应 Base 中的占位符
    newName: iceymoss/go-web     # 替换为真实的镜像
    newTag: "1.0"            # 替换 Tag
