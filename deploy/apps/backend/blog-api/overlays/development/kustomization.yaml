apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkspace-backend

resources:
  - ../../base

# Development ingress only. Production must supply its own canonical BLOG origin.
configMapGenerator:
  - name: blog-api-public-site
    literals:
      - PUBLIC_SITE_URL=http://dev.blog.test.com

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: blog-api
  - path: ingress-traefik-patch.yaml
    target:
      kind: Ingress
      name: blog-api-ingress

# ！！！ 核心调整：镜像替换策略
images:
  - name: inkspace-blog-api-image # 对应 Base 中的占位符
    newName: iceymoss/go-web     # 替换为真实的轻量级镜像
    newTag: "1.0"            # 替换 Tag
