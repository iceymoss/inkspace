# 管理后台服务配置
# Canonical BLOG origin, not the admin origin; PUBLIC_SITE_URL overrides it.
# Same value as server/scheduler; use http://localhost:3001 for Vite development.
public_site_url: http://localhost:8081

admin:
  port: 8083
  mode: debug


# 数据库配置（与主服务共享）
database:
  host: 127.0.0.1
  port: 3306
  username: iceymoss
  password: inkspace123
  database: inkspace
  charset: utf8mb4
  parseTime: true
  loc: Local
  maxIdleConns: 10
  maxOpenConns: 100

# Redis配置（与主服务共享）
redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  poolSize: 10

# JWT配置（与主服务共享）
jwt:
  secret: user-secret-key-SHOULD-NOT-BE-USED-IN-ADMIN
  adminSecret: admin-secret-key-DIFFERENT-from-user-MUST-CHANGE
  expireHours: 720

# 服务器配置
server:
  port: 8083
  mode: debug
